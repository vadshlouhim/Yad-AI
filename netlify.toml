[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/**", "node_modules/@keeratita/heic-converter/dist/**"]

[functions."automations-cron"]
  schedule = "* * * * *"
